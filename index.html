<script>
const SUPABASE_URL='https://xyzlgltalfiurzbxebzg.supabase.co';
const SUPABASE_KEY='sb_publishable_Ybp0I84vBz5FRdb5Esr6sg_dUKXexou';
const REGIONS=['Abruzzo','Basilicata','Calabria','Campania','Emilia-Romagna','Friuli-Venezia Giulia','Lazio','Liguria','Lombardia','Marche','Molise','Piemonte','Puglia','Sardegna','Sicilia','Toscana','Trentino-Alto Adige','Umbria','Valle d’Aosta','Veneto'];
const STATUSES=['Da contattare','Contattato','Interessato','Da richiamare','Cliente','Non interessato'];
const $=id=>document.getElementById(id); const today=()=>new Date().toISOString().slice(0,10);
let current=localStorage.getItem('overlineCurrentAccount')||'Mattia'; let data=[];
$('account').value=current; $('who').textContent=current; $('hdate').value=today();
const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
async function api(path,opts={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opts,headers:{...headers,...(opts.headers||{})}});let t=await r.text();if(!r.ok){let msg=t;try{let j=JSON.parse(t);msg=j.message||j.error||t}catch(_){}throw new Error('HTTP '+r.status+': '+msg)}return t?JSON.parse(t):null}
function toast(m,bad=false){let t=$('toast');t.textContent=(bad?'⚠ ':'✓ ')+m;t.className='toast '+(bad?'bad':'ok')+' show';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),3200)}
async function load(){try{toast('Aggiornamento dati…');let clients=await api('clienti?assegnato_a=eq.'+encodeURIComponent(current)+'&order=creato_il.desc');let ids=(clients||[]).map(x=>x.id);let feedback=[];if(ids.length)feedback=await api('feedback_clienti?cliente_id=in.('+ids.join(',')+')&order=creato_il.asc');data=(clients||[]).map(c=>({id:String(c.id),company:c.ragione_sociale||'',contact:c.referente||'',address:c.indirizzo||'',city:c.comune||'',province:c.provincia||'',region:c.regione||'',phone:c.telefono||'',email:c.email||'',status:c.stato||'Da contattare',nextCall:c.prossimo_richiamo||'',notes:c.note||'',history:(feedback||[]).filter(f=>String(f.cliente_id)===String(c.id)).map(f=>({date:(f.creato_il||'').slice(0,10),feedback:f.feedback||'',details:'',operator:f.assegnato_a||current}))}));renderAll();toast('Dati aggiornati')}catch(e){console.error(e);toast('Errore database: '+e.message,true)}}
$('account').onchange=async e=>{current=e.target.value;localStorage.setItem('overlineCurrentAccount',current);$('who').textContent=current;show('home');await load();toast('Account '+current+' caricato')};
$('refreshBtn').onclick=async()=>{await load()};
function seed(id,arr){$(id).innerHTML+=arr.map(x=>`<option>${x}</option>`).join('')}seed('region',REGIONS);seed('regionFilter',REGIONS);seed('status',STATUSES);seed('statusFilter',STATUSES);
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(v).classList.remove('hidden');document.querySelectorAll('.nav button[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v))}
document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>{show(b.dataset.view);renderAll()});
function badge(s){return `<span class="badge ${s==='Interessato'||s==='Cliente'?'interested':''}">${esc(s||'-')}</span>`}
function renderAll(){let now=today();$('kTotal').textContent=data.length;$('kNew').textContent=data.filter(x=>x.status==='Da contattare').length;$('kInterested').textContent=data.filter(x=>x.status==='Interessato').length;$('kLate').textContent=data.filter(x=>x.nextCall&&x.nextCall<now&&!['Cliente','Non interessato'].includes(x.status)).length;let pri=data.filter(x=>x.nextCall&&x.nextCall<=now).sort((a,b)=>a.nextCall.localeCompare(b.nextCall));$('priority').innerHTML=pri.length?table(pri):'<p class="muted">Nessun richiamo urgente.</p>';$('todayList').innerHTML=pri.length?table(pri):'<p class="muted">Nessuna attività prevista.</p>';renderClients();renderRegions()}
function table(rows){return `<table><thead><tr><th>Ragione sociale</th><th>Comune / Prov.</th><th>Regione</th><th>Telefono</th><th>Email</th><th>Stato</th><th>Richiamo</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.company||x.contact||x.phone||x.email||'Contatto senza nome')}</strong></td><td>${esc(x.city||'-')} ${x.province?'('+esc(x.province)+')':''}</td><td>${esc(x.region||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.email||'-')}</td><td>${badge(x.status)}</td><td>${x.nextCall||'-'}</td><td><button class="btn" onclick="editClient('${x.id}')">Apri</button></td></tr>`).join('')}</tbody></table>`}
function renderClients(){let q=$('search').value.toLowerCase(),s=$('statusFilter').value,r=$('regionFilter').value;let rows=data.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!s||x.status===s)&&(!r||x.region===r));$('clientTable').innerHTML=rows.length?table(rows):'<p class="muted">Nessun cliente trovato.</p>'}
['search','statusFilter','regionFilter'].forEach(id=>$(id).oninput=renderClients);
function renderRegions(){$('regionGrid').innerHTML=REGIONS.map(r=>{let a=data.filter(x=>x.region===r);return `<div class="card region" onclick="filterRegion('${r}')"><strong>${r}</strong><b>${a.length}</b><span class="muted">${a.filter(x=>x.status==='Interessato').length} interessati</span></div>`}).join('')}
window.filterRegion=r=>{$('regionFilter').value=r;show('clients');renderClients()};
function clearForm(){$('clientForm').reset();$('cid').value='';$('historyPanel').classList.add('hidden');$('deleteClientBtn').classList.add('hidden');$('deleteClientBtn').textContent='🗑 Elimina cliente';deleteArmed=false;$('saveClientBtn').textContent='Salva cliente';$('formTitle').textContent='Nuovo contatto'}
$('newBtn').onclick=()=>{clearForm();show('editor')}; $('cancelBtn').onclick=()=>show('clients');
function payload(){return {assegnato_a:current,ragione_sociale:$('company').value||null,referente:$('contact').value||null,indirizzo:$('address').value||null,comune:$('city').value||null,provincia:$('province').value||null,regione:$('region').value||null,telefono:$('phone').value||null,email:$('email').value||null,stato:$('status').value||'Da contattare',prossimo_richiamo:$('nextCall').value||null,note:$('notes').value||null,aggiornato_il:new Date().toISOString()}}
$('saveClientBtn').onclick=async()=>{let id=$('cid').value;try{let saved;if(id){saved=await api('clienti?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload())})}else{saved=await api('clienti',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload())});id=String(saved[0].id)}await load();editClient(id);toast('Cliente salvato correttamente per '+current)}catch(e){console.error(e);toast('Salvataggio non riuscito: '+e.message,true)}};
window.editClient=id=>{let x=data.find(z=>z.id===String(id));if(!x)return;show('editor');$('formTitle').textContent='Scheda cliente · '+(x.company||x.contact||x.phone||x.email||'Contatto');$('saveClientBtn').textContent='✓ Salva modifiche';$('deleteClientBtn').classList.remove('hidden');['company','contact','address','city','province','region','phone','email','status','nextCall','notes'].forEach(k=>$(k).value=x[k]||'');$('cid').value=x.id;$('historyPanel').classList.remove('hidden');renderHistory(x)};
let deleteArmed=false,deleteTimer=null;$('deleteClientBtn').onclick=async()=>{let id=$('cid').value;if(!id)return toast('Nessun cliente selezionato',true);if(!deleteArmed){deleteArmed=true;$('deleteClientBtn').textContent='⚠️ Conferma eliminazione';clearTimeout(deleteTimer);deleteTimer=setTimeout(()=>{deleteArmed=false;$('deleteClientBtn').textContent='🗑 Elimina cliente'},6000);return toast('Premi di nuovo per confermare eliminazione')}try{await api('clienti?id=eq.'+id,{method:'DELETE'});deleteArmed=false;clearForm();show('clients');await load();toast('Cliente eliminato correttamente')}catch(e){console.error(e);toast('Eliminazione non riuscita: '+e.message,true)}};
function renderHistory(x){$('timeline').innerHTML=(x.history||[]).slice().reverse().map(h=>`<div class="event"><strong>${esc(h.date)} · ${esc(h.operator||current)}</strong><br>${esc(h.feedback)}${h.details?'<br><span class="muted">'+esc(h.details)+'</span>':''}</div>`).join('')||'<p class="muted">Nessun contatto registrato.</p>'}
$('addHistory').onclick=async()=>{let id=$('cid').value;if(!id)return toast('Salva prima il cliente',true);let feedback=$('hfeedback').value.trim(),details=$('hdetails').value.trim();let testo=[feedback,details].filter(Boolean).join(' — ');try{await api('feedback_clienti',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({cliente_id:Number(id),assegnato_a:current,feedback:testo||'Contatto registrato',stato:$('status').value||null,prossimo_richiamo:$('nextCall').value||null})});$('hfeedback').value='';$('hdetails').value='';await load();editClient(id);toast('Feedback registrato correttamente')}catch(e){console.error(e);toast('Feedback non riuscito: '+e.message,true)}};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script></body></html>
